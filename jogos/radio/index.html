<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O rádio</title>
<meta name="theme-color" content="#17201d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap">
<link rel="stylesheet" href="../../comum/jogos.css">
<style>
.radio{position:relative;margin:4px auto 0;max-width:440px;padding:18px 16px 20px;border-radius:26px 26px 14px 14px;
  background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 12%,transparent 88%,rgba(0,0,0,.25)),
    repeating-linear-gradient(92deg,#5a3720 0 7px,#61401f 7px 11px,#53321b 11px 19px),#5a3720;
  box-shadow:inset 0 2px 0 rgba(255,220,170,.25),inset 0 -6px 12px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.marca{margin:0 0 10px;text-align:center;font:400 15px/1 var(--f-display);letter-spacing:.3em;color:#e9cf98;text-shadow:0 1px 0 #2a1708}
.marca small{display:block;margin-top:4px;font:600 10px/1 var(--f-ui);letter-spacing:.3em;color:#c9a46a}
.dial{position:relative;height:96px;border-radius:8px;overflow:hidden;touch-action:none;cursor:ew-resize;
  background:radial-gradient(120% 140% at 50% 0%,#fff3cf,#e8d39d 70%,#c9ae6c);box-shadow:inset 0 0 0 3px #2b1a0c,inset 0 0 0 5px #b8935a,inset 0 4px 14px rgba(0,0,0,.35)}
.dial.on{background:radial-gradient(120% 140% at 50% 0%,#fff9e0,#ffe7a6 60%,#e8c477)}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial text{font:600 13px var(--f-ui);fill:#2b1a0c}
.dial .tk{stroke:#2b1a0c;stroke-width:1}
.dial .agulha{position:absolute;top:8px;bottom:8px;left:0;width:3px;margin-left:-1.5px;background:#c0261b;box-shadow:0 0 6px rgba(192,38,27,.6);border-radius:2px;will-change:transform}
.dial .unid{position:absolute;right:12px;top:9px;font:600 10px/1 var(--f-ui);letter-spacing:.2em;color:#5a3a16}
.frente{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:16px}
.grade{height:120px;border-radius:10px;background:repeating-linear-gradient(0deg,#2a1a0e 0 3px,#d9c08a 3px 7px);box-shadow:inset 0 0 0 3px #2b1a0c,inset 0 0 18px rgba(0,0,0,.6);position:relative}
.olho{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#062a14;box-shadow:0 0 0 4px #2b1a0c,0 0 0 6px #8c6a3a,0 0 16px rgba(0,0,0,.6)}
.olho svg{width:100%;height:100%}
.olho .verde{fill:#1d6b39;transition:fill .2s}
.radio.on .olho .verde{fill:#3dff8e;filter:drop-shadow(0 0 5px #3dff8e)}
.botoes{display:grid;gap:12px;justify-items:center}
.knob{position:relative;width:96px;height:96px;border-radius:50%;touch-action:none;cursor:grab;
  background:radial-gradient(circle at 38% 32%,#4a3a2c,#1b130d 70%);box-shadow:0 6px 12px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,255,255,.12),0 0 0 4px #2b1a0c,0 0 0 6px #8c6a3a}
.knob::after{content:"";position:absolute;inset:14px;border-radius:50%;background:repeating-conic-gradient(#2a2018 0 6deg,#1a120c 6deg 12deg);box-shadow:inset 0 0 6px rgba(0,0,0,.8)}
.knob i{position:absolute;left:50%;top:7px;width:5px;height:20px;margin-left:-2.5px;border-radius:3px;background:#e9cf98;z-index:1;transform-origin:2.5px 41px}
.knob-lab{font:600 11px/1 var(--f-ui);letter-spacing:.24em;text-transform:uppercase;color:#e9cf98}
.fino{display:flex;gap:8px}
.fino button{appearance:none;width:44px;height:38px;border-radius:8px;border:1px solid #2b1a0c;background:#3a2414;color:#e9cf98;font:700 18px/1 var(--f-ui);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,220,170,.2)}
.liga{appearance:none;display:block;width:100%;margin-top:16px;min-height:48px;border-radius:10px;border:1px solid #2b1a0c;background:#2b1a0c;color:#e9cf98;font:600 15px/1 var(--f-ui);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.radio.on .liga{background:#3a2414;box-shadow:inset 0 1px 0 rgba(255,220,170,.25)}
.freq{margin:14px 0 0;text-align:center;font:400 30px/1 var(--f-display);letter-spacing:.06em}
.freq small{font:600 13px var(--f-ui);letter-spacing:.2em;color:var(--mute)}
.estado{min-height:44px;margin:8px 0 0;text-align:center;color:var(--ui-dim);font-size:15px}
.estado.achou{color:var(--lamp)}
.segue{margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <a class="voltar" href="../" aria-label="Voltar pros minigames">‹</a>
  <div class="tt"><b>O rádio</b><small id="sub">Coxilha Seca · 1978</small></div>
</header>
<main class="wrap">
  <p class="lede">Ligue o rádio e gire a sintonia devagar. Fone de ouvido ajuda.</p>
  <p class="pdline" id="prev" hidden>Prévia do mestre: os jogadores ainda não ouvem esta transmissão.</p>
  <section class="radio" id="radio" aria-label="Rádio">
    <p class="marca">SERENATA<small>5 válvulas · ondas médias</small></p>
    <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Sintonia" aria-valuemin="540" aria-valuemax="1600">
      <svg id="escala" aria-hidden="true"></svg>
      <div class="agulha" id="agulha"></div>
      <span class="unid">kHz</span>
    </div>
    <div class="frente">
      <div class="grade"><div class="olho" aria-hidden="true"><svg viewBox="-31 -31 62 62"><path class="verde" id="olho"/><circle r="7" fill="#062a14"/></svg></div></div>
      <div class="botoes">
        <div class="knob" id="knob" aria-hidden="true"><i id="mark"></i></div>
        <span class="knob-lab">Sintonia</span>
        <div class="fino"><button type="button" data-f="-1" aria-label="Um pouco pra trás">‹</button><button type="button" data-f="1" aria-label="Um pouco pra frente">›</button></div>
      </div>
    </div>
    <button class="liga" type="button" id="liga">Ligar</button>
  </section>
  <p class="freq" id="freq">— <small>kHz</small></p>
  <p class="estado" id="estado" aria-live="polite">Desligado.</p>
  <div class="segue" id="segue" hidden><a class="btn pri wide" href="../morse/">Anotar o Morse</a></div>
</main>

<script src="../../comum/config.js"></script>
<script src="../../supabase.js"></script>
<script src="../../comum/jogos.js"></script>
<script>
(function(){
'use strict';
var $=J.$,FMIN=540,FMAX=1600;
var S={f:+(J.LS.get('sdo_radio_f'))||900,on:false,alvo:null,morse:'',wpm:10,audio:'',morseOk:false,previa:false,certo:0,achou:false};
S.f=Math.min(FMAX,Math.max(FMIN,S.f));
var radio=$('#radio'),dial=$('#dial'),agulha=$('#agulha'),est=$('#estado');

/* escala do mostrador */
(function(){
  var W=400,H=96,svg=$('#escala'),h='';
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('preserveAspectRatio','none');
  for(var f=550;f<=1600;f+=10){
    var x=xDe(f,W),big=f%100===0;
    h+='<line class="tk" x1="'+x+'" x2="'+x+'" y1="'+(H-30)+'" y2="'+(H-30-(big?16:(f%50===0?10:5)))+'"/>';
  }
  [600,700,800,900,1000,1100,1200,1300,1400,1500].forEach(function(f){
    h+='<text x="'+xDe(f,W)+'" y="'+(H-12)+'" text-anchor="middle">'+(f/10)+'</text>';
  });
  h+='<line class="tk" x1="12" x2="'+(W-12)+'" y1="'+(H-30)+'" y2="'+(H-30)+'"/>';
  svg.innerHTML=h;
})();
function xDe(f,W){ return 14+(f-FMIN)/(FMAX-FMIN)*(W-28); }

/* ---------- som ---------- */
var A=null;
function montaSom(){
  var ac=J.audio(); if(!ac) return null;
  var mestre=ac.createGain(); mestre.gain.value=.9; mestre.connect(ac.destination);
  var chi=J.ruido(ac,3),bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=.6;
  var gChi=ac.createGain(); gChi.gain.value=0; chi.connect(bp); bp.connect(gChi); gChi.connect(mestre); chi.start();
  var sinal=ac.createGain(); sinal.gain.value=0; sinal.connect(mestre);
  var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; lp.connect(sinal);
  var ass=ac.createOscillator(),gAss=ac.createGain(); ass.type='sine'; ass.frequency.value=400; gAss.gain.value=0; ass.connect(gAss); gAss.connect(mestre); ass.start();
  var zum=ac.createOscillator(),gZum=ac.createGain(); zum.type='triangle'; zum.frequency.value=120; gZum.gain.value=.025; zum.connect(gZum); gZum.connect(lp); zum.start();
  A={ac:ac,mestre:mestre,gChi:gChi,sinal:sinal,lp:lp,ass:ass,gAss:gAss,prog:null,buf:null,laco:0,fonte:null};
  programa();
  return A;
}
/* o que a estação toca: o áudio do mestre, ou o Morse em laço */
function programa(){
  if(!A) return;
  clearTimeout(A.laco); if(A.prog){ A.prog.para(); A.prog=null; } if(A.fonte){ try{ A.fonte.stop(); }catch(e){} A.fonte=null; }
  if(S.alvo==null) return;
  if(S.audio){
    var url=S.audio;
    (A.buf&&A.bufUrl===url?Promise.resolve(A.buf):fetch(url).then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(function(b){ return new Promise(function(ok,no){ A.ac.decodeAudioData(b,ok,no); }); }))
      .then(function(buf){ A.buf=buf; A.bufUrl=url; if(!S.on||S.audio!==url) return; var s=A.ac.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(A.lp); s.start(); A.fonte=s; })
      .catch(function(){ S.audio=''; programa(); });
    return;
  }
  if(!S.morse) return;
  var gm=A.ac.createGain(); gm.gain.value=.55; gm.connect(A.lp);
  (function vez(){
    if(!S.on||!A) return;
    var t0=A.ac.currentTime+.4,m=J.tocaMorse(A.ac,S.morse,S.wpm,gm,t0,760);
    A.prog=m; A.laco=setTimeout(vez,(m.fim-A.ac.currentTime+3)*1000);
  })();
}
function desligaSom(){
  if(!A) return;
  clearTimeout(A.laco); if(A.prog) A.prog.para(); if(A.fonte){ try{ A.fonte.stop(); }catch(e){} }
  try{ A.mestre.disconnect(); }catch(e){}
  A=null;
}

/* ---------- sintonia ---------- */
var forca=function(){ return S.alvo==null?0:Math.max(0,1-Math.abs(S.f-S.alvo)/26); };
/* outras estações, longe e sem programa: só o assobio e um zumbido */
var LONGE=[690,1170];
var longe=function(){ return Math.min.apply(null,LONGE.map(function(x){ return Math.abs(S.f-x); })); };
function desenha(){
  var W=dial.clientWidth;
  agulha.style.transform='translateX('+(14+(S.f-FMIN)/(FMAX-FMIN)*(W-28))+'px)';
  $('#mark').style.transform='rotate('+((S.f-FMIN)*1.6%360)+'deg)';
  dial.setAttribute('aria-valuenow',Math.round(S.f));
  $('#freq').innerHTML=(S.on?Math.round(S.f):'—')+' <small>kHz</small>';
  var s=forca(),abre=S.on?(1-s)*80+8:0,a=abre*Math.PI/180;
  var r=27,x1=Math.sin(a/2)*r,y1=-Math.cos(a/2)*r;
  $('#olho').setAttribute('d',S.on?('M0 0 L'+(-x1)+' '+y1+' A'+r+' '+r+' 0 1 0 '+x1+' '+y1+' Z'):'');
  if(A){
    var t=A.ac.currentTime,s2=Math.pow(s,1.6),df=Math.min(S.alvo==null?99:Math.abs(S.f-S.alvo),longe());
    A.gChi.gain.setTargetAtTime(.32*(1-s2)+.025,t,.05);
    A.sinal.gain.setTargetAtTime(s2*(.85+.15*Math.sin(t*1.3)),t,.05);
    /* assobio: perto da estação, fica mais grave até sumir no ponto certo */
    var perto=df<18?1-df/18:0;
    A.ass.frequency.setTargetAtTime(30+df*85,t,.03);
    A.gAss.gain.setTargetAtTime(df<1.5?0:perto*.06,t,.05);
  }
  estado();
}
function estado(){
  var achou=false,txt;
  if(!S.on) txt='Desligado.';
  else {
    var s=forca();
    if(s>.88){ S.certo=S.certo||Date.now(); achou=Date.now()-S.certo>1400; txt=achou?'Sintonizado.':'Quase…'; }
    else { S.certo=0; var dl=longe(); txt=s>.35?'Tem alguma coisa aqui perto…':(s>0||dl<18)?(dl<2?'Uma estação longe, sem programa nenhum.':'Um assobio no meio do chiado…'):'Só chiado.'; }
  }
  est.textContent=txt; est.classList.toggle('achou',achou);
  if(achou!==S.achou){ S.achou=achou; if(achou&&navigator.vibrate) navigator.vibrate(30); }
  $('#segue').hidden=!(achou&&S.morseOk);
}
setInterval(function(){ if(S.on) desenha(); },250);
function muda(df){
  S.f=Math.min(FMAX,Math.max(FMIN,S.f+df));
  J.LS.set('sdo_radio_f',String(Math.round(S.f)));
  desenha();
}

/* arrastar no mostrador: devagar, como um rádio de verdade */
(function(){
  var x0=null;
  dial.addEventListener('pointerdown',function(e){ x0=e.clientX; try{ dial.setPointerCapture(e.pointerId); }catch(err){} });
  dial.addEventListener('pointermove',function(e){ if(x0==null) return; var dx=e.clientX-x0; x0=e.clientX; muda(dx*.6); });
  var fim=function(){ x0=null; }; dial.addEventListener('pointerup',fim); dial.addEventListener('pointercancel',fim);
  dial.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ e.preventDefault(); muda(e.shiftKey?-10:-1); }
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){ e.preventDefault(); muda(e.shiftKey?10:1); }
  });
})();
/* girar o botão */
(function(){
  var k=$('#knob'),ang=null;
  var angulo=function(e){ var r=k.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI; };
  k.addEventListener('pointerdown',function(e){ ang=angulo(e); try{ k.setPointerCapture(e.pointerId); }catch(err){} });
  k.addEventListener('pointermove',function(e){ if(ang==null) return; var a=angulo(e),d=a-ang; if(d>180) d-=360; if(d<-180) d+=360; ang=a; muda(d*.5); });
  var fim=function(){ ang=null; }; k.addEventListener('pointerup',fim); k.addEventListener('pointercancel',fim);
})();
/* ajuste fino, segurando repete */
(function(){
  var t=0,i=0;
  document.querySelectorAll('[data-f]').forEach(function(b){
    var d=+b.dataset.f;
    var vai=function(){ muda(d*(i>8?3:1)); i++; t=setTimeout(vai,i===1?380:90); };
    b.addEventListener('pointerdown',function(e){ e.preventDefault(); i=0; vai(); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev,function(){ clearTimeout(t); }); });
  });
})();

$('#liga').onclick=function(){
  S.on=!S.on;
  radio.classList.toggle('on',S.on); dial.classList.toggle('on',S.on);
  this.textContent=S.on?'Desligar':'Ligar';
  if(S.on) montaSom(); else desligaSom();
  desenha();
};

/* ---------- o que o mestre liberou ---------- */
async function carrega(){
  try{
    var e=await J.estado(),r=e.radio||{},m=e.morse||{},prev=false;
    if(!r.liberado&&J.ehMestre()&&J.LS.get('sdo_mk')){
      try{ var t=await J.rpc('sdo_m_j_ler',{p_senha:J.LS.get('sdo_mk')}); if(t.radio){ r=Object.assign({},t.radio.publico); prev=true; } if(t.morse&&!m.liberado) m={liberado:true}; }catch(err){}
    }
    var alvo=(r.liberado||prev)&&+r.freq>=FMIN?+r.freq:null;
    var mudou=alvo!==S.alvo||(r.morse||'')!==S.morse||(r.audio||'')!==S.audio||(+r.wpm||10)!==S.wpm;
    S.alvo=alvo; S.morse=r.morse||''; S.wpm=+r.wpm||10; S.audio=J.okUrl(r.audio)||''; S.morseOk=!!m.liberado; S.previa=prev;
    $('#prev').hidden=!prev;
    if(mudou&&A) programa();
    desenha();
  }catch(err){ est.textContent=J.erroTxt(err); }
}
carrega();
setInterval(function(){ if(!document.hidden) carrega(); },15000);
window.addEventListener('resize',desenha);
desenha();
})();
</script>
</body>
</html>
